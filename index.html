<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Snake</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
overflow:hidden;
}

.wrapper{
width:min(92vmin,600px);
aspect-ratio:1;
display:flex;
flex-direction:column;
gap:12px;
}

.header{
display:flex;
justify-content:space-between;
color:white;
font-size:18px;
}

.board{
flex:1;
display:grid;
grid-template-columns:repeat(20,1fr);
grid-template-rows:repeat(20,1fr);
background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);
border-radius:16px;
padding:6px;
box-shadow:
0 25px 60px rgba(0,0,0,0.6),
inset 0 0 20px rgba(255,255,255,0.05);
}

.cell{
border-radius:6px;
}

.snake{
background:linear-gradient(145deg,#00ff9c,#00c96f);
box-shadow:
0 0 10px #00ff9c,
inset 0 0 6px rgba(255,255,255,0.6);
border-radius:8px;
animation:snakePulse .6s infinite alternate;
}

@keyframes snakePulse{
from{transform:scale(.95)}
to{transform:scale(1)}
}

.food{
background:radial-gradient(circle,#ff4d6d,#b00020);
border-radius:50%;
animation:foodBounce 1s infinite;
box-shadow:0 0 12px #ff4d6d;
}

@keyframes foodBounce{
0%{transform:scale(.9)}
50%{transform:scale(1.2)}
100%{transform:scale(.9)}
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;
background:rgba(0,0,0,0.5);
color:white;
font-size:28px;
border-radius:20px;
}

button{
padding:12px 22px;
border:none;
border-radius:10px;
background:#00ff9c;
font-size:16px;
cursor:pointer;
}

.touch{
display:grid;
grid-template-columns:repeat(3,60px);
gap:10px;
justify-content:center;
margin-top:6px;
}

.touch button{
width:60px;
height:60px;
font-size:20px;
}

</style>
</head>
<body>

<div class="wrapper">

<div class="header">
<div>Score: <span id="score">0</span></div>
<div>Best: <span id="best">0</span></div>
</div>

<div class="board" id="board"></div>

<div class="touch">
<div></div>
<button data-dir="up">▲</button>
<div></div>
<button data-dir="left">◀</button>
<button data-dir="down">▼</button>
<button data-dir="right">▶</button>
</div>

</div>

<div class="overlay" id="overlay">
<div>3D Snake</div>
<button onclick="startGame()">Start Game</button>
</div>

<script>

const board = document.getElementById("board")
const scoreEl = document.getElementById("score")
const bestEl = document.getElementById("best")
const overlay = document.getElementById("overlay")

let grid = 20
let snake
let food
let dir
let score
let speed = 110
let loop

let best = localStorage.getItem("snakeBest") || 0
bestEl.textContent = best

function startGame(){

snake = [{x:10,y:10}]
dir = {x:1,y:0}
score = 0

spawnFood()

overlay.style.display="none"

clearInterval(loop)
loop = setInterval(update,speed)

}

function spawnFood(){

food = {
x: Math.floor(Math.random()*grid),
y: Math.floor(Math.random()*grid)
}

}

function update(){

const head = {
x: snake[0].x + dir.x,
y: snake[0].y + dir.y
}

if(
head.x<0 ||
head.y<0 ||
head.x>=grid ||
head.y>=grid ||
snake.some(s=>s.x===head.x && s.y===head.y)
){
gameOver()
return
}

snake.unshift(head)

if(head.x===food.x && head.y===food.y){

score++
scoreEl.textContent=score
spawnFood()

}else{
snake.pop()
}

draw()

}

function draw(){

board.innerHTML=""

for(let y=0;y<grid;y++){
for(let x=0;x<grid;x++){

const cell=document.createElement("div")
cell.className="cell"

if(snake.some(s=>s.x===x && s.y===y)){
cell.classList.add("snake")
}

if(food.x===x && food.y===y){
cell.classList.add("food")
}

board.appendChild(cell)

}
}

}

function gameOver(){

clearInterval(loop)

if(score>best){
best=score
localStorage.setItem("snakeBest",best)
bestEl.textContent=best
}

overlay.style.display="flex"
overlay.innerHTML=`
<div>Game Over</div>
<div>Score ${score}</div>
<button onclick="startGame()">Play Again</button>
`

}

window.addEventListener("keydown",e=>{

if(e.key==="ArrowUp" && dir.y!==1) dir={x:0,y:-1}
if(e.key==="ArrowDown" && dir.y!==-1) dir={x:0,y:1}
if(e.key==="ArrowLeft" && dir.x!==1) dir={x:-1,y:0}
if(e.key==="ArrowRight" && dir.x!==-1) dir={x:1,y:0}

})

document.querySelectorAll(".touch button").forEach(b=>{
b.onclick=()=>{

const d=b.dataset.dir

if(d==="up" && dir.y!==1) dir={x:0,y:-1}
if(d==="down" && dir.y!==-1) dir={x:0,y:1}
if(d==="left" && dir.x!==1) dir={x:-1,y:0}
if(d==="right" && dir.x!==-1) dir={x:1,y:0}

}
})

</script>

</body>
</html>
